<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Signal Lost | Neon Arcade</title>
    <link rel="stylesheet" href="/neon-arcade.css">
    <style>
        :root {
            --c-bg: #050510;
            --c-primary: #00f3ff;
            --c-secondary: #fcee0a;
            --c-danger: #ff003c;
            --c-text: #ffffff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--c-bg);
            color: var(--c-text);
            font-family: var(--na-font-body);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* CRT Effect */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 4px, 6px 100%;
            z-index: 1000;
            pointer-events: none;
            opacity: 0.4;
        }
        @media (prefers-reduced-motion: reduce) {
            body::after { animation: none; opacity: 0.4; }
        }
        
        main {
            text-align: center;
            padding: 40px;
            border: 2px solid var(--c-danger);
            background: rgba(10, 10, 30, 0.6);
            box-shadow: 0 0 35px rgba(255, 0, 60, 0.25);
            max-width: 500px;
            width: 90%;
            border-radius: 4px;
            z-index: 10;
        }
        h1 {
            font-size: 4rem;
            color: var(--c-danger);
            text-shadow: 0 0 15px var(--c-danger);
            margin-bottom: 10px;
            letter-spacing: 5px;
        }
        h2 {
            font-size: 1.5rem;
            color: var(--c-secondary);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        .btn {
            display: inline-block;
            background: transparent;
            color: var(--c-primary);
            border: 2px solid var(--c-primary);
            padding: 12px 30px;
            font-family: var(--na-font-display);
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }
        .btn:hover {
            background: var(--c-primary);
            color: var(--c-bg);
            box-shadow: 0 0 20px var(--c-primary);
        }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <h2>Signal Lost</h2>
        <p>You have drifted into the dead zone. The requested sector does not exist or has been permanently purged from the mainframe.</p>
        <a href="/" class="btn">Return to Hub</a>
    </main>
</body>
</html>
